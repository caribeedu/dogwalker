name: build

on:
  push:
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  # Fast gate on every PR: types + lint. No packaging.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:coverage

  # Per-OS installers, built only when a v* tag is pushed. Each runner produces
  # its own OS's artifact (electron-forge runs only the host's makers) and
  # attaches it to the tag's GitHub Release.
  make:
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write # create/append the Release and upload assets
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Linux packaging deps (rpm/deb)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm fakeroot
      - run: npm ci
      - run: npm run make
      - uses: actions/upload-artifact@v4
        with:
          name: dogwalker-${{ matrix.os }}
          path: out/make/**/*
          if-no-files-found: error
      # Attach this OS's installers to the Release (each matrix OS appends).
      # First job to finish creates the Release; body is the CHANGELOG section
      # for this tag plus the standard download footer.
      - name: Compose release notes from CHANGELOG
        shell: bash
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME#v}"
          awk -v ver="$VER" '
            $0 == "## " ver {p=1; next}
            p && /^## / {exit}
            p {print}
          ' docs/CHANGELOG.md | sed '/./,$!d' > /tmp/changes.md
          {
            echo "**Dogwalker ${VER}.**"
            echo
            cat /tmp/changes.md
            echo
            echo "---"
            echo
            echo "📦 Download the installer for your platform below — **macOS**, **Windows**, **Linux**. Installers are unsigned for now, so expect a first-launch Gatekeeper/SmartScreen prompt."
            echo "📖 Full history: [CHANGELOG](https://github.com/caribeedu/dogwalker/blob/main/docs/CHANGELOG.md)"
          } > release-notes.md
      - name: Attach installers to the Release
        uses: softprops/action-gh-release@v2
        with:
          files: out/make/**/*
          body_path: release-notes.md
          fail_on_unmatched_files: true

  # Once every OS's installers are on the Release, bump the package-manager
  # channels to this version. Each channel is guarded by its secret, so this job
  # is a green no-op until you configure the taps/keys (see packaging/README.md).
  # Secrets: PACKAGING_TOKEN (a PAT with contents:write on the homebrew-dogwalker
  # and scoop-bucket repos) and, for the AUR, AUR_SSH_PRIVATE_KEY / AUR_USERNAME
  # / AUR_EMAIL.
  publish-packaging:
    needs: make
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # `secrets` can't be used in a step `if`, so fold the presence check into
    # job-level booleans (secrets ARE allowed in job env) and gate on those.
    env:
      HAS_PKG_TOKEN: ${{ secrets.PACKAGING_TOKEN != '' }}
      HAS_AUR: ${{ secrets.AUR_SSH_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version and artifact checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME#v}"
          dir="$(mktemp -d)"
          gh release download "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" -D "$dir" \
            -p "Dogwalker-${VER}-arm64.dmg" \
            -p "Dogwalker-win32-x64-${VER}.zip" \
            -p "dogwalker_${VER}_amd64.deb"
          {
            echo "VER=$VER"
            echo "DMG_SHA=$(sha256sum "$dir/Dogwalker-${VER}-arm64.dmg" | cut -d' ' -f1)"
            echo "ZIP_SHA=$(sha256sum "$dir/Dogwalker-win32-x64-${VER}.zip" | cut -d' ' -f1)"
            echo "DEB_SHA=$(sha256sum "$dir/dogwalker_${VER}_amd64.deb" | cut -d' ' -f1)"
          } >> "$GITHUB_ENV"

      - name: Update Homebrew cask (${{ github.repository_owner }}/homebrew-dogwalker)
        if: env.HAS_PKG_TOKEN == 'true'
        env:
          TOKEN: ${{ secrets.PACKAGING_TOKEN }}
        run: |
          set -euo pipefail
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY_OWNER}/homebrew-dogwalker.git" tap
          mkdir -p tap/Casks
          sed -e "s/^  version .*/  version \"${VER}\"/" \
              -e "s/^  sha256 .*/  sha256 \"${DMG_SHA}\"/" \
              packaging/homebrew/dogwalker.rb > tap/Casks/dogwalker.rb
          cd tap
          git add Casks/dogwalker.rb
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "dogwalker ${VER}" || { echo "no change"; exit 0; }
          git push

      - name: Update Scoop manifest (${{ github.repository_owner }}/scoop-bucket)
        if: env.HAS_PKG_TOKEN == 'true'
        env:
          TOKEN: ${{ secrets.PACKAGING_TOKEN }}
        run: |
          set -euo pipefail
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY_OWNER}/scoop-bucket.git" bucket
          mkdir -p bucket/bucket
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/Dogwalker-win32-x64-${VER}.zip"
          jq --arg v "$VER" --arg h "$ZIP_SHA" --arg url "$url" \
            '.version=$v | .architecture."64bit".url=$url | .architecture."64bit".hash=$h' \
            packaging/scoop/dogwalker.json > bucket/bucket/dogwalker.json
          cd bucket
          git add bucket/dogwalker.json
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "dogwalker ${VER}" || { echo "no change"; exit 0; }
          git push

      - name: Stamp the AUR PKGBUILD
        if: env.HAS_AUR == 'true'
        run: |
          set -euo pipefail
          sed -i \
            -e "s/^pkgver=.*/pkgver=${VER}/" \
            -e "s/^pkgrel=.*/pkgrel=1/" \
            -e "s/^sha256sums=.*/sha256sums=('${DEB_SHA}')/" \
            packaging/aur/PKGBUILD

      - name: Publish to the AUR (dogwalker-bin)
        if: env.HAS_AUR == 'true'
        uses: KSXGitHub/github-actions-deploy-aur@v2
        with:
          pkgname: dogwalker-bin
          pkgbuild: ./packaging/aur/PKGBUILD
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "dogwalker ${{ env.VER }}"
